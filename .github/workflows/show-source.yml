
name: Show Brain Quest Ad Files

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/brainquest
          unzip -q brain-quest-admob-test.zip -d /tmp/brainquest

      - name: Show Android Ad Setup Files
        run: |
          echo "===== APP GRADLE ====="
          find /tmp/brainquest -path '*/app/build.gradle.kts' -exec cat {} \;

          echo "===== AD INTEGRATION BRIDGE ====="
          find /tmp/brainquest -name AdIntegrationBridge.kt -exec cat {} \;

          echo "===== MAIN ACTIVITY ====="
          find /tmp/brainquest -name MainActivity.kt -exec cat {} \;

          echo "===== GAME HUB VIEWMODEL ====="
          find /tmp/brainquest -name GameHubViewModel.kt -exec cat {} \;

          echo "===== REPOSITORY HINT FUNCTIONS ====="
          find /tmp/brainquest -name BrainQuestRepository.kt -exec grep -n -i -E -C 15 "useHint|grantAdBonusReward|hint" {} \;


name: Show Brain Quest Ad Files

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/brainquest
          unzip -q brain-quest-admob-test.zip -d /tmp/brainquest

      - name: Show requestHint function
        run: |
          FILE=$(find /tmp/brainquest -name GameHubViewModel.kt -print -quit)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          s = Path(sys.argv[1]).read_text()
          start = s.find("fun requestHint()")
          if start < 0:
              raise SystemExit("requestHint function not found")
          next_fn = s.find("\n    fun ", start + 1)
          print(s[start:next_fn if next_fn >= 0 else len(s)])
          PY

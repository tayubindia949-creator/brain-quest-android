
name: Show Brain Quest Ad Files

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/brainquest
          unzip -q brain-quest-admob-test.zip -d /tmp/brainquest

      - name: Show Reward and Hint Code
        run: |
          echo "===== GAME REWARD AND HINT CODE ====="
          find /tmp/brainquest -name GameHubViewModel.kt -exec grep -n -i -E -C 12 "adController|preloadRewardedAd|hint|reward" {} \;

          echo "===== MAIN ACTIVITY ====="
          find /tmp/brainquest -name MainActivity.kt -exec cat {} \;

          echo "===== ANDROID MANIFEST ====="
          find /tmp/brainquest -name AndroidManifest.xml -exec cat {} \;

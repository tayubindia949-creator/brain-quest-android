
name: Show Brain Quest Ad Files

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/brainquest
          unzip -q brain-quest-admob-test.zip -d /tmp/brainquest

      - name: Show Ad Controller and Dependencies
        run: |
          echo "===== AD PACKAGE FILES ====="
          find /tmp/brainquest -type f -path "*/com/example/ad/*.kt" -print -exec cat {} \;

          echo "===== AD REWARD REFERENCES ====="
          grep -R -n "AdRewardController\|NoOpAdRewardController" /tmp/brainquest --include="*.kt" || true

          echo "===== APP GRADLE ====="
          find /tmp/brainquest -path "*/app/build.gradle.kts" -exec cat {} \;

          echo "===== VERSION CATALOG ====="
          find /tmp/brainquest -path "*/gradle/libs.versions.toml" -exec cat {} \;

          echo "===== ANDROID MANIFEST ====="
          find /tmp/brainquest -name AndroidManifest.xml -exec cat {} \;


name: Build Brain Quest Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'brain-quest.zip'
      - 'brain-quest-admob-test.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q brain-quest-admob-test.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          test -f "$PROJECT_DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Add Unity Ads SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          dep = 'implementation("com.unity3d.ads:unity-ads:4.22.0")'
          if dep not in s:
              match = re.search(r'(?m)^dependencies\s*\{', s)
              if not match:
                  raise SystemExit("dependencies block not found")
              pos = match.end()
              s = s[:pos] + "\n    " + dep + s[pos:]
              p.write_text(s)

          root = Path(".")
          bridge = next(root.rglob("AdIntegrationBridge.kt"))
          activity = next(root.rglob("MainActivity.kt"))
          vm = next(root.rglob("GameHubViewModel.kt"))

          bridge.write_text("""package com.example.ad

          import android.app.Activity
          import android.content.Context
          import java.lang.ref.WeakReference
          import com.unity3d.ads.*

          interface AdRewardController {
              val isAdsEnabled: Boolean
              fun preloadRewardedAd()
              fun showRewardedAd(onRewarded: () -> Unit, onUnavailable: () -> Unit)
          }

          class NoOpAdRewardController : AdRewardController {
              override val isAdsEnabled = false
              override fun preloadRewardedAd() {}
              override fun showRewardedAd(onRewarded: () -> Unit, onUnavailable: () -> Unit) {
                  onUnavailable()
              }
          }

          @OptIn(UnityAdsExperimental::class)
          class UnityAdsRewardController(activity: Activity) : AdRewardController {
              companion object {
                  private const val GAME_ID = "800449182"
                  private const val PLACEMENT_ID = "BP_Rewarded_Android"
              }

              private val activityRef = WeakReference(activity)
              private val appContext: Context = activity.applicationContext
              @Volatile private var initialized = false
              @Volatile private var loading = false
              @Volatile private var rewardedAd: RewardedAd? = null

              override val isAdsEnabled: Boolean
                  get() = initialized

              init {
                  val config = InitializationConfiguration.Builder(GAME_ID)
                      .withContext(appContext)
                      .withTestMode(true)
                      .build()

                  UnityAds.initialize(config, InitializationListener { error ->
                      initialized = error == null
                      if (initialized) preloadRewardedAd()
                  })
              }

              @Synchronized
              override fun preloadRewardedAd() {
                  if (!initialized || loading || rewardedAd != null) return
                  loading = true
                  val config = LoadConfiguration.Builder(PLACEMENT_ID).build()
                  RewardedAd.load(config, RewardedLoadListener { ad, error ->
                      loading = false
                      rewardedAd = ad
                  })
              }

              override fun showRewardedAd(
                  onRewarded: () -> Unit,
                  onUnavailable: () -> Unit
              ) {
                  val activity = activityRef.get()
                  val ad = rewardedAd

                  if (activity == null || ad == null) {
                      onUnavailable()
                      preloadRewardedAd()
                      return
                  }

                  rewardedAd = null
                  var rewardGiven = false

                  ad.show(
                      activity,
                      ShowConfiguration.Builder().build(),
                      object : RewardedShowListener {
                          override fun onStarted(unityAd: RewardedAd) {}
                          override fun onClicked(unityAd: RewardedAd) {}

                          override fun onRewarded(unityAd: RewardedAd) {
                              if (!rewardGiven) {
                                  rewardGiven = true
                                  onRewarded()
                              }
                          }

                          override fun onCompleted(
                              unityAd: RewardedAd,
                              state: ShowFinishState
                          ) {
                              preloadRewardedAd()
                          }

                          override fun onFailed(
                              unityAd: RewardedAd,
                              error: UnityAdsError
                          ) {
                              onUnavailable()
                              preloadRewardedAd()
                          }
                      }
                  )
              }
          }
          """)

          s = activity.read_text()
          s = s.replace(
              "import com.example.ad.NoOpAdRewardController",
              "import com.example.ad.UnityAdsRewardController"
          )
          s = s.replace(
              "val adController = NoOpAdRewardController()",
              "val adController = UnityAdsRewardController(this)"
          )
          if "UnityAdsRewardController(this)" not in s:
              raise SystemExit("MainActivity update failed")
          activity.write_text(s)

          s = vm.read_text()
          pattern = r'if \(!consumed\) \{.*?return@launch\s*\}'
          replacement = """if (!consumed) {
                      adController.showRewardedAd(
                          onRewarded = {
                              viewModelScope.launch {
                                  repository.grantAdBonusReward(coins = 0, hints = 1)
                                  requestHint()
                              }
                          },
                          onUnavailable = {
                              _statusToast.value = "Rewarded ad is not ready. Please try again shortly."
                          }
                      )
                      return@launch
                  }"""
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("requestHint update failed")
          vm.write_text(s)

          print("Unity rewarded ad integration patch applied")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK path
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode release signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Quest-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
